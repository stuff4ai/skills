name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  built-skills:
    name: built skills are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I build.py --check

  checks:
    name: checks
    if: always()
    needs: [built-skills]
    runs-on: ubuntu-latest
    steps:
      - name: every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a job ended with: $r"; exit 1; }
          done
